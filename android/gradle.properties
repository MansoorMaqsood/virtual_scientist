# Gradle performance
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Unity streaming assets
unityStreamingAssets=true

# Required for AGP 8.2+
android.useFullClasspathForDexingTransform=true

# NDK (make sure this exact version is installed via Android Studio > SDK Manager)
ndkVersion=27.0.12077973

# ❌ Don’t put compileSdk/targetSdk/minSdk here
# Move them into android/app/build.gradle(.kts)



# Android SDK / NDK settings
#compileSdk=36
#targetSdk=34
#minSdk=24
#ndkVersion=27.0.12077973
